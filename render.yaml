databases:
  - name: course-reg-db
    databaseName: course_registration
    user: postgres
    plan: free

services:
  - type: web
    name: course-registration-system
    env: node
    plan: free
    buildCommand: npm run build
    preDeployCommand: npm run db:init
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DATABASE_URL
        fromDatabase:
          name: course-reg-db
          property: connectionString
